<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>GoldenMC</title>

<style>
body{
    margin:0;
    background:#020617;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

h1{margin-top:60px;font-size:60px;}

.ip{color:#22c55e;cursor:pointer;}

.container{
    margin-top:40px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:#0f172a;
    padding:20px;
    width:160px;
    border-radius:15px;
}

button{
    margin-top:10px;
    padding:8px 15px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}

input{
    padding:10px;
    margin:5px;
}
</style>
</head>

<body>

<h1>GoldenMC</h1>
<p class="ip" onclick="copyIP()">goldenmcee.falixsvr.me</p>

<div id="loginBox">
<h3>Giriş</h3>
<input id="user" placeholder="Minecraft isim"><br>
<input id="pass" type="password" placeholder="Şifre"><br>
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>

<div id="shop" style="display:none;">

<h2>VIP Paketleri</h2>

<div class="container">

<div class="card"><h3>VIP</h3><p>60₺</p><button onclick="buy('vip')">Al</button></div>
<div class="card"><h3>VIP+</h3><p>80₺</p><button onclick="buy('vip+')">Al</button></div>
<div class="card"><h3>KVIP</h3><p>120₺</p><button onclick="buy('kvip')">Al</button></div>
<div class="card"><h3>KVIP+</h3><p>160₺</p><button onclick="buy('kvip+')">Al</button></div>
<div class="card"><h3>GoldenVIP</h3><p>200₺</p><button onclick="buy('goldenvip')">Al</button></div>
<div class="card"><h3>GoldenVIP+</h3><p>240₺</p><button onclick="buy('goldenvip+')">Al</button></div>

</div>
</div>

<script>

let currentUser=null;

function copyIP(){
navigator.clipboard.writeText("goldenmcee.falixsvr.me");
alert("IP kopyalandı");
}

function register(){
localStorage.setItem("user_"+user.value,pass.value);
alert("Kayıt tamam");
}

function login(){
let p=localStorage.getItem("user_"+user.value);

if(p===pass.value){
currentUser=user.value;
loginBox.style.display="none";
shop.style.display="block";
}else{
alert("Hatalı");
}
}

async function buy(rank){

if(!currentUser)return alert("Giriş yap");

alert("Ödeme sayfasına yönlendiriliyor...");

/* BURASI GERÇEK ÖDEMEYE GİDER */
window.location.href="/odeme.html?rank="+rank;

}

</script>

</body>
</html>
