<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HovaNetwork — Yönetim Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#07070f; --surface:#0f0f1e; --surface2:#161628; --border:rgba(255,255,255,.08);
    --gold:#ffd700; --vip-plus:#c084fc; --cyan:#22d3ee; --green:#4ade80; --red:#f87171;
    --text:#e2e8f0; --muted:#94a3b8; --radius:12px;
  }
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:480px;margin:80px auto;padding:0 20px;}
  .panel-wrap{max-width:900px;margin:40px auto;padding:0 20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
  .logo-hex{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),var(--vip-plus));clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;color:#000;}
  .logo-text{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--vip-plus));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  h2{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;margin-bottom:20px;text-align:center;}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .form-group input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:11px 14px;outline:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;width:100%;transition:transform .2s;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#ff9d00);color:#000;}
  .btn-red{background:linear-gradient(135deg,var(--red),#b91c1c);color:#fff;}
  .btn:hover{transform:translateY(-1px);}
  .err{color:var(--red);font-size:13px;margin-top:12px;text-align:center;display:none;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
  .role-badge{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;}
  .role-yardimci{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}
  .role-yonetici{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.3);}
  .role-kurucu{background:rgba(192,132,252,.12);color:var(--vip-plus);border:1px solid rgba(192,132,252,.3);}

  .cmd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:28px;}
  .cmd-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .cmd-card h3{font-size:15px;font-weight:600;margin-bottom:14px;}
  .cmd-card .form-group{margin-bottom:10px;}
  .locked{opacity:.35;pointer-events:none;position:relative;}
  .locked::after{content:'🔒 Yetkin yok';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:rgba(7,7,15,.4);border-radius:14px;}

  .console-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:28px;}
  .console-out{background:#000;border-radius:9px;padding:14px;font-family:monospace;font-size:12px;color:var(--green);min-height:80px;max-height:220px;overflow-y:auto;white-space:pre-wrap;margin-top:12px;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:all .35s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .logout{color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;}
  #page-panel{display:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="page-login" class="wrap">
  <div class="logo"><div class="logo-hex">HN</div><span class="logo-text">HovaNetwork</span></div>
  <div class="card">
    <h2>🔐 Yönetim Paneli Girişi</h2>
    <div class="form-group">
      <label>Panel Kullanıcı Adı</label>
      <input type="text" id="login-user" placeholder="kullanici_adin">
    </div>
    <div class="form-group">
      <label>Şifre</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn btn-gold" onclick="login()">Giriş Yap</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- PANEL -->
<div id="page-panel" class="panel-wrap">
  <div class="topbar">
    <div class="logo" style="margin:0;">
      <div class="logo-hex" style="width:32px;height:32px;font-size:11px;">HN</div>
      <span class="logo-text" style="font-size:18px;">Yönetim Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <span id="who"></span>
      <span class="role-badge" id="role-badge"></span>
      <span class="logout" onclick="logout()">Çıkış yap</span>
    </div>
  </div>

  <div class="cmd-grid">
    <!-- Yardımcı+ -->
    <div class="cmd-card" data-action="kick">
      <h3>👢 Kick</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="kick-player"></div>
      <div class="form-group"><input placeholder="Sebep (opsiyonel)" id="kick-reason"></div>
      <button class="btn btn-gold" onclick="runCmd('kick',{player:val('kick-player'),reason:val('kick-reason')})">Kick At</button>
    </div>

    <div class="cmd-card" data-action="mute">
      <h3>🔇 Mute</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="mute-player"></div>
      <div class="form-group"><input placeholder="Süre (örn: 10m, 1h)" id="mute-dur"></div>
      <button class="btn btn-gold" onclick="runCmd('mute',{player:val('mute-player'),duration:val('mute-dur')})">Mute Uygula</button>
    </div>

    <div class="cmd-card" data-action="kitVer">
      <h3>🎁 Kit Ver</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="kit-player"></div>
      <div class="form-group"><input placeholder="Kit adı" id="kit-name"></div>
      <button class="btn btn-gold" onclick="runCmd('kitVer',{player:val('kit-player'),kit:val('kit-name')})">Kit Gönder</button>
    </div>

    <!-- Yönetici+ -->
    <div class="cmd-card" data-action="ban">
      <h3>⛔ Ban</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="ban-player"></div>
      <div class="form-group"><input placeholder="Sebep" id="ban-reason"></div>
      <button class="btn btn-red" onclick="runCmd('ban',{player:val('ban-player'),reason:val('ban-reason')})">Banla</button>
    </div>

    <div class="cmd-card" data-action="gamemode">
      <h3>🎮 Gamemode</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="gm-player"></div>
      <div class="form-group">
        <select id="gm-mode">
          <option value="survival">Survival</option>
          <option value="creative">Creative</option>
          <option value="adventure">Adventure</option>
          <option value="spectator">Spectator</option>
        </select>
      </div>
      <button class="btn btn-gold" onclick="runCmd('gamemode',{player:val('gm-player'),mode:val('gm-mode')})">Uygula</button>
    </div>

    <div class="cmd-card" data-action="whitelistAdd">
      <h3>📋 Whitelist Ekle</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="wl-player"></div>
      <button class="btn btn-gold" onclick="runCmd('whitelistAdd',{player:val('wl-player')})">Ekle</button>
    </div>

    <!-- Kurucu -->
    <div class="cmd-card" data-action="op">
      <h3>👑 OP Ver</h3>
      <div class="form-group"><input placeholder="Oyuncu adı" id="op-player"></div>
      <button class="btn btn-red" onclick="runCmd('op',{player:val('op-player')})">OP Yap</button>
    </div>
  </div>

  <div class="console-box" id="console-box" style="display:none;">
    <h3>💻 Ham Konsol Komutu (Sadece Kurucu)</h3>
    <div class="form-group" style="margin-top:14px;">
      <input placeholder="örn: whitelist off" id="console-cmd">
    </div>
    <button class="btn btn-red" onclick="runConsole()">Komutu Çalıştır</button>
    <div class="console-out" id="console-out">Çıktı burada görünecek...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = ""; // Backend aynı origin'de yayınlanıyorsa boş bırak. Ayrı domain'deyse örn: "https://api.hovanetwork.net"
let token = localStorage.getItem("hn_token") || "";

function val(id){ return document.getElementById(id).value.trim(); }

function toast(msg, ok=true){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'rgba(74,222,128,.4)' : 'rgba(248,113,113,.4)';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3000);
}

async function login(){
  const username = val('login-user');
  const password = val('login-pass');
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';

  try{
    const r = await fetch(API + '/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Giriş başarısız'; errEl.style.display='block'; return; }

    token = data.token;
    localStorage.setItem('hn_token', token);
    await loadPanel();
  }catch(e){
    errEl.textContent = 'Sunucuya bağlanılamadı';
    errEl.style.display = 'block';
  }
}

function logout(){
  localStorage.removeItem('hn_token');
  token = '';
  document.getElementById('page-panel').style.display = 'none';
  document.getElementById('page-login').style.display = 'block';
}

async function loadPanel(){
  const r = await fetch(API + '/api/me', { headers:{ 'Authorization': 'Bearer ' + token } });
  if(!r.ok){ logout(); return; }
  const me = await r.json();

  document.getElementById('page-login').style.display = 'none';
  document.getElementById('page-panel').style.display = 'block';
  document.getElementById('who').textContent = me.username;
  const badge = document.getElementById('role-badge');
  const roleNames = { yardimci:'Yardımcı', yonetici:'Yönetici', kurucu:'Kurucu' };
  badge.textContent = roleNames[me.role] || me.role;
  badge.className = 'role-badge role-' + me.role;

  // Her komut kartını yetkiye göre kilitle/aç
  document.querySelectorAll('.cmd-card').forEach(card=>{
    const action = card.dataset.action;
    if(!me.allowedActions.includes(action)) card.classList.add('locked');
    else card.classList.remove('locked');
  });

  document.getElementById('console-box').style.display = me.canRawConsole ? 'block' : 'none';
}

async function runCmd(action, params){
  try{
    const r = await fetch(API + '/api/command', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({action, params})
    });
    const data = await r.json();
    if(!r.ok){ toast(data.error || 'Hata oluştu', false); return; }
    toast('✅ Komut çalıştırıldı: ' + data.command);
  }catch(e){
    toast('Sunucuya bağlanılamadı', false);
  }
}

async function runConsole(){
  const command = val('console-cmd');
  if(!command) return;
  try{
    const r = await fetch(API + '/api/console', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({command})
    });
    const data = await r.json();
    const out = document.getElementById('console-out');
    if(!r.ok){ out.textContent = '❌ ' + (data.error||'Hata'); return; }
    out.textContent = '> ' + data.command + '\n' + (data.response || '(boş yanıt)');
  }catch(e){
    document.getElementById('console-out').textContent = '❌ Sunucuya bağlanılamadı';
  }
}

// Sayfa yüklenince token varsa otomatik giriş dene
if(token) loadPanel();
</script>
</body>
</html>
