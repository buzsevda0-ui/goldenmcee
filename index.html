<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>GoldenMC Panel</title>

<style>
body{
  background:#0a0806;
  color:#FFD700;
  font-family:Arial;
  text-align:center;
}
button{
  margin:5px;
  padding:10px 20px;
  background:#111;
  border:1px solid gold;
  color:gold;
  cursor:pointer;
}
input{
  padding:8px;
  margin:5px;
  background:#111;
  border:1px solid gold;
  color:white;
}
.card{
  border:1px solid gold;
  margin:10px;
  padding:10px;
}
</style>

</head>
<body>

<h1>GoldenMC</h1>

<button onclick="register()">Kayıt Ol</button> <button onclick="login()">Giriş Yap</button>

<h2>VIP Satın Al</h2>
<input id="rank" placeholder="VIP adı (VIP, VIP+, KVIP...)">
<input id="price" placeholder="Fiyat">
<br>
<button onclick="buy()">Satın Al</button>

<script>

// ===== STORAGE =====
let users = JSON.parse(localStorage.getItem("users") || "[]");
let orders = JSON.parse(localStorage.getItem("orders") || "[]");

// default adminler
if(!users.find(u=>u.username==="umut1313")){
  users.push({username:"umut1313", password:"13132141", admin:true});
}
if(!users.find(u=>u.username==="umut1366")){
  users.push({username:"umut1366", password:"Hallah1366", admin:true});
}
localStorage.setItem("users", JSON.stringify(users));

// ===== REGISTER =====
function register(){
  const u = prompt("Kullanıcı adı:");
  const p = prompt("Şifre:");

  if(!u || !p) return;

  if(users.find(x=>x.username===u)){
    alert("Bu kullanıcı zaten var!");
    return;
  }

  users.push({username:u,password:p,admin:false});
  localStorage.setItem("users", JSON.stringify(users));

  alert("Kayıt başarılı!");
}

// ===== LOGIN =====
function login(){
  const u = prompt("Kullanıcı adı:");
  const p = prompt("Şifre:");

  const user = users.find(x=>x.username===u && x.password===p);

  if(!user){
    alert("Hatalı giriş!");
    return;
  }

  localStorage.setItem("currentUser", JSON.stringify(user));

  if(user.admin){
    showAdminPanel();
  }else{
    alert("Giriş başarılı!");
  }
}

// ===== BUY =====
function buy(){
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));

  if(!currentUser){
    alert("Önce giriş yap!");
    return;
  }

  const rank = document.getElementById("rank").value;
  const price = document.getElementById("price").value;

  if(!rank || !price){
    alert("Bilgileri doldur!");
    return;
  }

  const order = {
    user: currentUser.username,
    rank: rank,
    price: price,
    date: new Date().toLocaleString()
  };

  orders.push(order);
  localStorage.setItem("orders", JSON.stringify(orders));

  alert("Satın alma kaydedildi!");
}

// ===== ADMIN PANEL =====
function showAdminPanel(){
  let html = "<h1>ADMIN PANEL</h1>";

  if(orders.length === 0){
    html += "<p>Hiç satın alma yok</p>";
  }

  orders.forEach(o=>{
    html += `
      <div class="card">
        👤 ${o.user}<br>
        📦 ${o.rank}<br>
        💰 ${o.price}₺<br>
        📅 ${o.date}
      </div>
    `;
  });

  html += `<br><button onclick="location.reload()">Geri Dön</button>`;

  document.body.innerHTML = html;
}

</script>

</body>
</html>
