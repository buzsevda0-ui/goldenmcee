<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>GoldenMC</title>

<style>
body{background:#0a0806;color:#FFD700;font-family:Arial;text-align:center}
.container{max-width:800px;margin:auto}
.card{background:#111;border:1px solid gold;padding:15px;margin:10px;border-radius:8px}
button{padding:10px 15px;margin:5px;background:black;color:gold;border:1px solid gold;cursor:pointer}
input{padding:8px;margin:5px;background:black;color:white;border:1px solid gold}
</style>

</head>

<body>
<div class="container">

<h1>GoldenMC Market</h1>

<button onclick="register()">Kayıt Ol</button> <button onclick="login()">Giriş Yap</button>

<h2>VIP Paketler</h2>

<div class="card">
  VIP - 60₺<br>
  <button onclick="buy('VIP',60)">Al</button>
</div>

<div class="card">
  VIP+ - 80₺<br>
  <button onclick="buy('VIP+',80)">Al</button>
</div>

<div class="card">
  GoldenVIP+ - 200₺<br>
  <button onclick="buy('GoldenVIP+',200)">Al</button>
</div>

</div>

<script>

// RESET ADMIN HER ZAMAN
let users = [
  {username:"umut1313",password:"umut131321415161",admin:true},
  {username:"umut1366",password:"Hallah1366",admin:true}
];

let savedUsers = JSON.parse(localStorage.getItem("users")||"[]");
savedUsers.forEach(u=>{
  if(!users.find(x=>x.username===u.username)){
    users.push(u);
  }
});

let orders = JSON.parse(localStorage.getItem("orders")||"[]");

// REGISTER
function register(){
  let u=prompt("Kullanıcı adı");
  let p=prompt("Şifre");

  if(users.find(x=>x.username===u)){
    alert("Var zaten");
    return;
  }

  users.push({username:u,password:p,admin:false});
  localStorage.setItem("users",JSON.stringify(users));
  alert("Kayıt tamam");
}

// LOGIN
function login(){
  let u=prompt("Kullanıcı adı");
  let p=prompt("Şifre");

  let user=users.find(x=>x.username===u && x.password===p);

  if(!user){
    alert("Hatalı giriş");
    return;
  }

  localStorage.setItem("currentUser",JSON.stringify(user));

  if(user.admin){
    adminPanel();
  }else{
    alert("Giriş başarılı");
  }
}

// BUY
function buy(rank,price){
  let user=JSON.parse(localStorage.getItem("currentUser"));

  if(!user){
    alert("Giriş yap");
    return;
  }

  orders.push({
    user:user.username,
    rank,
    price,
    status:"BEKLEMEDE",
    date:new Date().toLocaleString()
  });

  localStorage.setItem("orders",JSON.stringify(orders));

  alert("Talep gönderildi! Admin onaylayacak.");
}

// ADMIN PANEL
function adminPanel(){
  let html="<h1>ADMIN PANEL</h1>";

  orders.forEach((o,i)=>{
    html+=`
    <div class="card">
      👤 ${o.user}<br>
      📦 ${o.rank}<br>
      💰 ${o.price}₺<br>
      📅 ${o.date}<br>
      📌 ${o.status}<br>
      <button onclick="approve(${i})">Onayla</button>
    </div>
    `;
  });

  html+=`<br><button onclick="location.reload()">Geri</button>`;

  document.body.innerHTML=html;
}

// ONAYLA
function approve(i){
  orders[i].status="ONAYLANDI";
  localStorage.setItem("orders",JSON.stringify(orders));
  alert("Onaylandı");
  adminPanel();
}

</script>

</body>
</html>
